version: "3.8"

services:
  srt-restreamer:
    build:
      context: .
      dockerfile: Dockerfile
    image: srt-restreamer:latest
    container_name: srt-restreamer

    # Publish only the web UI and the allowed SRT listener port range.
    # Internal media-plane UDP ports stay on loopback inside the container.
    ports:
      - "8080:8080"
      - "5000-5008:5000-5008/udp"
      - "6000-10100:6000-10100/udp"

    volumes:
      - ./data:/app/data

    environment:
      - DATABASE_URL=sqlite:///data/restreamer.db
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - SECRETS_KEY=${SECRETS_KEY:?SECRETS_KEY must be set}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - SRT_LISTENER_PORT_RANGE=${SRT_LISTENER_PORT_RANGE:-5000-5008,6000-10100}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8080

    # Hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    restart: unless-stopped

    # Health check against unauthenticated liveness endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
